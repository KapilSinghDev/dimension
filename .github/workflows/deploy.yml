name: Deploy to EC2

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your main repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Copy the entire workspace to /home/ubuntu/migrations
      - name: Copy app files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/migrations"

      # 3. Run installation, build, and migration commands on the EC2 instance
