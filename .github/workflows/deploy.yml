name: Deploy to EC2

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull the latest code from your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Copy code files to your EC2 instance via SCP
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/dimension-dev-app"
          exclude: ".git/, node_modules/"

      # 3. Run installation and restart commands on your EC2 instance
      - name: Run deploy commands via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/dimension-dev-app
            npm install
