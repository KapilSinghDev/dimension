name: Deploy to EC2 Servers

on:
  push:
    branches:
      - development
    paths-ignore:
      - ".github/workflows/**"

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1. Copy migration files via SCP to the server
      - name: Copy migration files via SCP to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "migrations"
          target: "/home/ubuntu/dimension"

      # 2. Navigate and run migrations via SSH
      - name: Run Database Migrations via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Navigating and Running Migrations ---"
            # Point to the correct folder matching your target + source structure
            cd /home/ubuntu/dimension/migrations
            # Run your TypeORM migration command here
            npm run migration:run

  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy app files via SCP to Alpha Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dimensionfrontend,dimensionbackend"
          target: "/home/ubuntu/dimension"

      - name: Run app setup commands via SSH on Alpha Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH=$PATH:/usr/local/bin

            echo "--- Setting up Backend ---"
            cd /home/ubuntu/dimension/dimensionbackend
            npm install

            echo "--- Setting up Frontend ---"
            cd /home/ubuntu/dimension/dimensionfrontend
            npm install
