name: Deploy to EC2 Servers

on:
  push:
    branches:
      - development

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy migration files via SCP to DB Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dimension/migrations"
          target: "/home/ubuntu/migrations"

      - name: Run Database Migrations via SSH on DB Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Navigating and Running Migrations ---"
            cd /home/ubuntu/migrations/dimension/migrations

  deploy-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy app files via SCP to Alpha Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dimension/dimensionfrontend,dimension/dimensionbackend"
          target: "/home/ubuntu/dimension"

      - name: Run app setup commands via SSH on Alpha Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_ALPHA_SERVER }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "--- Setting up Backend ---"
            cd /home/ubuntu/dimension/dimensionbackend
            npm install

            echo "--- Setting up Frontend ---"
            cd /home/ubuntu/dimension/dimensionfrontend
            npm install
