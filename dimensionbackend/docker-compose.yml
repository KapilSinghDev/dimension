version: "3.8"

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: dimension_postgres
    restart: always
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dimensionbackend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
